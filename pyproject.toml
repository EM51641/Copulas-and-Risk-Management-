[project]
name = "copula"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "pandas-datareader>=0.10.0",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "setuptools>=80.8.0",
    "yfinance>=0.2.61",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["copula", "copula*", "copula/*.pyi", "copula/*.pyx"]
exclude = ["tests*", "docs*", "examples*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[build-system]
requires = ["setuptools>=61.0", "wheel", "Cython>=3.0.0", "numpy>=2.2.5"]
build-backend = "setuptools.build_meta"